<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brain Tumor Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .lds-dual-ring {
            display: none;
            width: 32px;
            height: 32px;
        }
        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 1px;
            border: 4px solid #3498db;
            border-color: #3498db transparent #3498db transparent;
            border-radius: 50%;
            animation: lds-dual-ring 1.2s linear infinite;
        }
        @keyframes lds-dual-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg text-center">
        <h1 class="text-2xl font-semibold mb-4">Brain Tumor Detection</h1>
        <form method="post" enctype="multipart/form-data" action="/upload/" class="space-y-4">
            <input type="file" name="data" accept=".jpg,.jpeg,.png" required class="text-blue-500">
            <div class="flex justify-center items-center space-x-2">
                <button type="submit" id="btn" class="bg-blue-500 text-white py-2 px-6 rounded hover:bg-blue-600">
                    Upload & Predict
                </button>
                <div class="lds-dual-ring" id="loading-animation"></div>
            </div>
        </form>
    </div>
    <script>
        $("form").on("submit", function() {
            $("#loading-animation").show();
            $("#btn").prop("disabled", true).text("Processing...");
        });
    </script>
</body>
</html>
